name: Validate Applications

on:
  push:
    paths:
      - 'src/applications/**'
  pull_request:
    paths:
      - 'src/applications/**'

jobs:
  validate-apps:
    name: Check app.py structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate app.py files
        run: python .github/scripts/validate_apps.py
