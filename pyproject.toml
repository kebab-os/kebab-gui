[project]
name = "kebab-gui"
version = "1.0.0"
description = "A high-performance, window-based operating system"
readme = "README.md"
requires-python = ">=3.7"
authors = [
    {name = "James", username = "@7aimez"}
]
dependencies = [
    "requests>=2.25.1",
    "pandas"
]

[project.scripts]
run-my-app = "my_package.main:run"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
